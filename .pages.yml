media: media
content:
  - name: pages
    label: Articles
    type: collection
    path: docs
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: body
        label: Body
        type: rich-text

  - name: projects
    label: Project Cards
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: image
        label: Project image
        type: image
        required: true
        options:
          path: projects
          extensions: [jpg, jpeg, png, webp, avif, svg]
          rename: safe
      - name: category
        label: Category
        type: string
      - name: year
        label: Year / label
        type: string
      - name: link
        label: Project link
        type: string
      - name: order
        label: Display order
        type: number
      - name: visible
        label: Visible on website
        type: boolean
        default: true

  - name: bookmarks
    label: Bookmarks
    type: collection
    path: bookmarks
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, tags, date, featured, visible]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: url
        label: Website URL
        type: string
        required: true
        description: Full link including https://
      - name: tags
        label: Tags
        type: string
        list: true
        description: Add as many descriptive tags as you need.
      - name: date
        label: Date saved
        type: date
        required: true
      - name: image
        label: Preview image
        type: image
        description: Optional image uploaded to the site's media folder.
      - name: featured
        label: Featured bookmark
        type: boolean
        default: false
      - name: visible
        label: Show on website
        type: boolean
        default: true
