media: media
content:
  - name: projects
    label: Project Cards
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: image
        label: Project image
        type: image
        required: true
        options:
          path: projects
          extensions: [jpg, jpeg, png, webp, avif, svg]
          rename: safe
      - name: category
        label: Category
        type: string
      - name: year
        label: Year / label
        type: string
      - name: link
        label: Project link
        type: string
      - name: order
        label: Display order
        type: number
      - name: visible
        label: Visible on website
        type: boolean
        default: true

  - name: bookmarks
    label: Bookmarks
    type: file
    path: data/bookmarks.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: url
        label: Website URL
        type: string
        required: true
      - name: tags
        label: Tags
        type: string
        list: true
        description: Each tag automatically becomes a category filter on the website.
      - name: date
        label: Date saved
        type: date
        required: true
      - name: image
        label: Preview image
        type: image
      - name: featured
        label: Featured bookmark
        type: boolean
        default: false
      - name: visible
        label: Show on website
        type: boolean
        default: true

  - name: experience
    label: Experience
    type: file
    path: data/experience.json
    format: json
    list: true
    fields:
      - name: role
        label: Job title / role
        type: string
        required: true
      - name: date
        label: Date range
        type: string
        required: true
      - name: organization
        label: Organization
        type: string
      - name: description
        label: Description
        type: text
      - name: order
        label: Display order
        type: number
      - name: visible
        label: Show on website
        type: boolean
        default: true

  - name: recent_jams
    label: Recent Jams
    type: file
    path: data/recent-jams.json
    format: json
    list: true
    fields:
      - name: kind
        label: Card type
        type: string
        required: true
        description: Use book, song or movie to choose the card design.
      - name: title
        label: Title
        type: string
        required: true
      - name: creator
        label: Author / Artist / Director
        type: string
      - name: detail
        label: Note
        type: text
      - name: year
        label: Year
        type: string
      - name: image
        label: Cover / Artwork
        type: image
        options:
          path: recent-jams
          extensions: [jpg, jpeg, png, webp, avif]
          rename: safe
      - name: link
        label: Link
        type: string
      - name: order
        label: Display order
        type: number
      - name: visible
        label: Show on website
        type: boolean
        default: true

  - name: shots
    label: Shots
    type: file
    path: data/shots.json
    format: json
    list: true
    fields:
      - name: title
        label: Hover title
        type: string
        required: true
      - name: image
        label: Image (PNG, JPEG, GIF or SVG)
        type: image
        options:
          path: shots
          extensions: [png, jpg, jpeg, gif, svg]
          rename: safe
      - name: lottie
        label: Lottie animation (JSON)
        type: file
        options:
          path: shots
          extensions: [json]
          rename: safe
        description: Use this instead of an image for a Lottie animation. Upload the exported .json file.
      - name: order
        label: Display order
        type: number
      - name: visible
        label: Show on website
        type: boolean
        default: true
